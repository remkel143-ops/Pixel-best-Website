<!DOCTYPE html>
<html>
<head>
<title>Request a Quote - PixelNest</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial,Helvetica,sans-serif;padding:40px;background:#f5f7fa}
form input,form select,form textarea{width:100%;padding:10px;margin:10px 0;border-radius:6px;border:1px solid #ccc}
button{padding:10px 20px;background:#06b6d4;color:#fff;border:none;border-radius:6px;cursor:pointer}
h1{text-align:center}
</style>
</head>
<body>

<h1>Request a Website Quote</h1>
<form>
<input type="text" placeholder="Full Name" required>
<input type="text" placeholder="Business Name">
<input type="email" placeholder="Email" required>
<input type="tel" placeholder="Phone">
<select>
<option>Business Type</option>
<option>Small Business</option>
<option>Ecommerce</option>
<option>Startup</option>
</select>
<select>
<option>Budget Range</option>
<option>$500 - $1,000</option>
<option>$1,000 - $3,000</option>
<option>$3,000+</option>
</select>
<textarea placeholder="Describe your project"></textarea>
<button type="submit">Submit Quote Request</button>
</form>

</body>
</html>
